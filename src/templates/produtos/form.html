{% extends "base.html" %}
{% block titulo %}{{ titulo }} · Aurora Vendas{% endblock %}
{% block conteudo %}
<h1>{{ titulo }}<span class="heading-dot">.</span></h1>
<p>Preencha as informações do produto.</p>
<form method="post">
  <label for="nome">Nome</label>
  <input id="nome" name="nome" value="{{ nome }}" maxlength="120" required>

  <label for="preco">Preço</label>
  <input id="preco" name="preco" value="{{ preco }}" placeholder="0,00" required>

  <label for="estoque">Estoque</label>
  <input id="estoque" name="estoque" type="number" min="0" value="{{ estoque }}" required>

  <label class="check">
    <input type="checkbox" name="ativo" {% if ativo %}checked{% endif %}>
    Ativo
  </label>

  <p>
    <button type="submit">Salvar</button>
    <a href="{{ url_for('produtos') }}">Cancelar</a>
  </p>
</form>
{% endblock %}
