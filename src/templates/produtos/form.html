{% extends "base.html" %}
{% block titulo %}{{ titulo }} · Aurora Vendas{% endblock %}
{% block conteudo %}
<h1>{{ titulo }}</h1>
<form method="post">
  <label>Nome</label>
  <input name="nome" value="{{ nome }}" maxlength="120" required>

  <label>Preço</label>
  <input name="preco" value="{{ preco }}" placeholder="0,00" required>

  <label>Estoque</label>
  <input name="estoque" type="number" min="0" value="{{ estoque }}" required>

  <label class="check">
    <input type="checkbox" name="ativo" {% if ativo %}checked{% endif %}>
    Ativo
  </label>

  <p>
    <button type="submit">Salvar</button>
    <a href="{{ url_for('produtos') }}">Cancelar</a>
  </p>
</form>
{% endblock %}
