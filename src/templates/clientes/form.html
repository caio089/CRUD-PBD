{% extends "base.html" %}
{% block titulo %}{{ titulo }} · Aurora Vendas{% endblock %}
{% block conteudo %}
<h1>{{ titulo }}</h1>
<form method="post">
  <label>Nome</label>
  <input name="nome" value="{{ nome }}" maxlength="120" required>

  <label>E-mail</label>
  <input name="email" type="email" value="{{ email }}" maxlength="120" required>

  <label>Telefone</label>
  <input name="telefone" value="{{ telefone }}" maxlength="20">

  <p>
    <button type="submit">Salvar</button>
    <a href="{{ url_for('clientes') }}">Cancelar</a>
  </p>
</form>
{% endblock %}
