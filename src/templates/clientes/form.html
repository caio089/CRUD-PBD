{% extends "base.html" %}
{% block titulo %}{{ titulo }} · Aurora Vendas{% endblock %}
{% block conteudo %}
<h1>{{ titulo }}<span class="heading-dot">.</span></h1>
<p>Preencha os dados para manter seu cadastro organizado.</p>
<form method="post">
  <label for="nome">Nome</label>
  <input id="nome" name="nome" value="{{ nome }}" maxlength="120" required>

  <label for="email">E-mail</label>
  <input id="email" name="email" type="email" value="{{ email }}" maxlength="120" required>

  <label for="telefone">Telefone</label>
  <input id="telefone" name="telefone" value="{{ telefone }}" maxlength="20">

  <p>
    <button type="submit">Salvar</button>
    <a href="{{ url_for('clientes') }}">Cancelar</a>
  </p>
</form>
{% endblock %}
